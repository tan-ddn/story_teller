# Qwen3.6-27B Censor LoRA on dataset v3 (with teacher labels) and the short profile (no rubric in the prompt, texts <= ~512 tokens,
# chunked at inference). Short sequences are what fits in memory on the Mac (probe: 33.6 GB at
# ~640 tokens; 70+ GB at ~1,800). Derived with training.censor.plan.
model: Qwen3.6-27B-4bit
adapter_name: censor-lora-short-v3-qwen36_27b
fine_tune_type: lora
num_layers: 16
lora_parameters:
  rank: 8
  dropout: 0.0
  scale: 20.0
batch_size: 1
grad_accumulation_steps: 4
iters: 3633
learning_rate: 5.0e-05
lr_schedule:
  name: cosine_decay
  warmup: 30
  arguments:
  - 5.0e-05
  - auto  # computed from iters: decays over the whole run
  - 1.0e-06
max_seq_length: 1024
mask_prompt: true
grad_checkpoint: true
steps_per_report: 40
steps_per_eval: 1211
val_batches: 60
save_every: 400
seed: 0
dataset: data/processed/censor_sft_short_v3
censor_profile: short
