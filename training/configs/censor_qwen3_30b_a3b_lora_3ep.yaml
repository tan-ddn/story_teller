# Censor LoRA fine-tune, 3 epochs from scratch (compare with the 1-epoch censor-lora-v1).
# Base: mlx-community/Qwen3-30B-A3B-4bit (MoE, ~3B active); trains in ~27 GB per the
# 2026-10-16 feasibility check. Data: data/processed/censor_sft (pipelines/censor_sft).
model: Qwen3-30B-A3B-4bit          # folder in MLX_MODELS_DIR
adapter_name: censor-lora-v1-3ep   # folder in MLX_ADAPTERS_DIR
fine_tune_type: lora
num_layers: 16                     # of 48 transformer blocks
lora_parameters: {rank: 8, dropout: 0.0, scale: 20.0}
batch_size: 1
grad_accumulation_steps: 4         # effective batch 4
iters: 7200                        # 3 epochs of 2,381 samples at batch 1 (mlx-lm counts batches)
learning_rate: 5.0e-5
# The schedule advances once per optimizer update: 7200 / 4 accumulation steps = 1800 updates.
lr_schedule: {name: cosine_decay, warmup: 30, arguments: [5.0e-5, 1800, 1.0e-6]}
max_seq_length: 4096               # rubric + JSON instruction (~1.9k tokens) + text + answer
mask_prompt: true                  # loss on the answer only
grad_checkpoint: true
steps_per_report: 40
steps_per_eval: 800
val_batches: 60
save_every: 2400                   # one checkpoint per epoch
seed: 0
