[project]
name = "story-teller"
version = "0.1.0"
description = "Story-continuity engine and multi-LLM writing scaffold for long-form fiction"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
]

[dependency-groups]
dev = [
    "bandit>=1.7",
    "dvc>=3.67.1",
    "mypy>=1.13",
    "pip-audit>=2.10.1",
    "pytest>=8.3",
    "ruff>=0.7",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["airflow.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pipelines.dags.*"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
